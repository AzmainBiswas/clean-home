<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- New Tab: Browser window with plus -->
  <symbol id="new-tab-icon" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6m4-2h6v6m-11 5L20 4"/>
  </symbol>

  <!-- Browser Tab with Plus -->
  <symbol id="tab-plus-icon" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 0 1 2-2h4.5a2 2 0 0 1 1.6.8L12.5 8H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7zm9 5v6m-3-3h6"/>
  </symbol>

  <!-- Browser Window / Tab -->
  <symbol id="tab-icon" viewBox="0 0 24 24">
    <rect width="20" height="16" x="2" y="4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" rx="3"/>
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 9h20M6 6.5h.01M9 6.5h.01"/>
  </symbol>

  <!-- Home (Clean Home) -->
  <symbol id="home-icon" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9.5L12 3l9 6.5V20a1.5 1.5 0 0 1-1.5 1.5h-5a1 1 0 0 1-1-1v-5h-3v5a1 1 0 0 1-1 1h-5A1.5 1.5 0 0 1 3 20V9.5z"/>
  </symbol>

  <!-- Spotlight Search -->
  <symbol id="search-icon" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m20 20-3.5-3.5"/>
  </symbol>

  <!-- Bookmarks -->
  <symbol id="bookmark-icon" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
  </symbol>

  <!-- Wallpaper / Background Image -->
  <symbol id="wallpaper-icon" viewBox="0 0 24 24">
    <rect width="18" height="18" x="3" y="3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" rx="3"/>
    <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 15-5-5L5 21"/>
  </symbol>

  <!-- Settings / Sliders -->
  <symbol id="settings-icon" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"/>
  </symbol>

  <!-- Frosted Blur -->
  <symbol id="blur-icon" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3a9 9 0 0 1 0 18v-18z"/>
  </symbol>

  <!-- Plus -->
  <symbol id="plus-icon" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m-7-7h14"/>
  </symbol>

  <!-- Close / Remove -->
  <symbol id="close-icon" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6L6 18M6 6l12 12"/>
  </symbol>

  <!-- External Link -->
  <symbol id="external-link-icon" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6m4-7h6v6m-11 5L20 3"/>
  </symbol>
</svg>
